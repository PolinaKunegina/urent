services:
  partner-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/secrets/service-account.json
    volumes:
      - ./data:/app/data            # база с часами по хэштегам переживает перезапуски
      - ./secrets:/app/secrets:ro   # ключ сервисного аккаунта Google
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
